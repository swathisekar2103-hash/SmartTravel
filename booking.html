
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Package - Smart Travel Planner</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #243047;
        }
        .container {
            width: min(92%, 560px);
            margin: 45px auto;
            padding: 28px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(0,0,0,.09);
        }
        h1 { margin-top: 0; color: #174f78; }
        .package-info {
            background: #eef6fb;
            padding: 15px;
            border-radius: 9px;
            margin-bottom: 22px;
            line-height: 1.7;
        }
        label {
            display: block;
            margin: 14px 0 6px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #c8d2dc;
            border-radius: 7px;
            font-size: 15px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 7px;
            background: #176b9b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #105477; }
        .error {
            padding: 11px;
            color: #8b1e1e;
            background: #fdeaea;
            border-radius: 7px;
        }
        .back {
            display: inline-block;
            margin-top: 18px;
            color: #176b9b;
        }
        .amount-preview {
            margin-top: 15px;
            padding: 12px;
            background: #f0f8f7;
            border-radius: 8px;
            color: #087f68;
            font-weight: bold;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Book Your Trip</h1>

        <section class="package-info">
            <strong>Package:</strong>
            {{ package["package_name"] }}<br>
            <strong>Destination:</strong>
            {{ package["destination"] }}<br>
            <strong>Saved package budget:</strong>
            ₹{{ "%.2f"|format(package["budget"] or 0) }}
        </section>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST"
              action="{{ url_for('book_package', package_id=package['id']) }}">

            <label for="traveller_name">Traveller Name</label>
            <input type="text" id="traveller_name"
                   name="traveller_name"
                   value="{{ request.form.get('traveller_name', '') }}"
                   required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   value="{{ request.form.get('email', '') }}"
                   required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone"
                   value="{{ request.form.get('phone', '') }}"
                   required>

            <label for="travellers">Number of Travellers</label>
            <input type="number" id="travellers"
                   name="travellers"
                   min="1" step="1"
                   value="{{ request.form.get('travellers', 1) }}"
                   required>

            <label for="price_per_person">
                Price Per Person (₹)
            </label>
            <input type="number" id="price_per_person"
                   name="price_per_person"
                   min="1" step="0.01"
                   value="{{ request.form.get('price_per_person', package['budget'] if package['budget'] else '') }}"
                   placeholder="Enter amount per person"
                   required>

            <div class="amount-preview">
                Price per person: ₹
                <span id="unit-price">0.00</span><br>
                Total amount: ₹
                <span id="total-price">0.00</span>
            </div>

            <button type="submit">Confirm Booking</button>
        </form>

        <a class="back"
           href="{{ url_for('package_details', package_id=package['id']) }}">
            Back to Package
        </a>
    </main>

    <script>
        const priceInput =
            document.getElementById("price_per_person");

        const travellersInput =
            document.getElementById("travellers");

        const unitPriceOutput =
            document.getElementById("unit-price");

        const totalPriceOutput =
            document.getElementById("total-price");

        function updateAmount() {
            const price =
                Math.max(0, Number(priceInput.value) || 0);

            const travellers =
                Math.max(1, Number(travellersInput.value) || 1);

            unitPriceOutput.textContent = price.toFixed(2);

            totalPriceOutput.textContent =
                (price * travellers).toFixed(2);
        }

        priceInput.addEventListener("input", updateAmount);
        travellersInput.addEventListener("input", updateAmount);

        updateAmount();
    </script>
</body>
</html>
